services:
  - type: web
    name: rakshai-ml-inference
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.ml_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: RAKSHAI_ML_API_KEY
        generateValue: true
